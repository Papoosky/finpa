name: CD

on:
  push:
    tags:
      - "finpa-v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: [self-hosted, oracle, finpa]
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to /opt/finpa
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude "node_modules" \
            --exclude "mobile/node_modules" \
            --exclude "backend/.venv" \
            --exclude "__pycache__" \
            ./ /opt/finpa/

      - name: Deploy production compose
        working-directory: /opt/finpa
        run: |
          test -f .env
          docker compose --env-file .env -f docker-compose.prod.yml up -d --build

          for attempt in $(seq 1 24); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' finpa-backend 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "Finpa backend is healthy"
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Finpa backend became unhealthy"
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Timed out waiting for Finpa backend health (last status: $status)"
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi
            sleep 5
          done

          for attempt in $(seq 1 12); do
            tunnel_status=$(docker inspect --format='{{.State.Status}}' finpa-cloudflared 2>/dev/null || true)
            if [ "$tunnel_status" = "running" ]; then
              echo "Finpa Cloudflare Tunnel is running"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Finpa Cloudflare Tunnel failed to start (last status: $tunnel_status)"
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 cloudflared
              exit 1
            fi
            sleep 5
          done

          docker compose --env-file .env -f docker-compose.prod.yml ps
          docker image prune -f

  deploy-mobile:
    name: Deploy Mobile (EAS Update)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish update
        run: eas update --branch production --non-interactive --message "$COMMIT_MSG"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.ref_name }}
