name: CD

on:
  push:
    tags:
      - "finpa-v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: [self-hosted, oracle, finpa]
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to /opt/finpa
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude "node_modules" \
            --exclude "mobile/node_modules" \
            --exclude "backend/.venv" \
            --exclude "__pycache__" \
            ./ /opt/finpa/

      - name: Deploy production compose
        working-directory: /opt/finpa
        run: |
          test -f .env
          docker compose --env-file .env -f docker-compose.prod.yml up -d --build

          for attempt in $(seq 1 24); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' finpa-backend 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "Finpa backend is healthy"
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Finpa backend became unhealthy"
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Timed out waiting for Finpa backend health (last status: $status)"
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi
            sleep 5
          done

          for attempt in $(seq 1 12); do
            tunnel_status=$(docker inspect --format='{{.State.Status}}' finpa-cloudflared 2>/dev/null || true)
            if [ "$tunnel_status" = "running" ]; then
              echo "Finpa Cloudflare Tunnel is running"
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Finpa Cloudflare Tunnel failed to start (last status: $tunnel_status)"
              docker compose --env-file .env -f docker-compose.prod.yml ps
              docker compose --env-file .env -f docker-compose.prod.yml logs --tail=100 cloudflared
              exit 1
            fi
            sleep 5
          done

          docker compose --env-file .env -f docker-compose.prod.yml ps
          docker image prune -f

  deploy-web:
    name: Deploy Web (Cloudflare Workers)
    needs: deploy-backend
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        run: pnpm deploy
        env:
          VITE_API_URL: https://finpa-api.pzuni.com
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
