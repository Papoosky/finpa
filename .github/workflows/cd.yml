name: CD

on:
  push:
    tags:
      - "finpa-v*.*.*"
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        working-directory: backend
        run: |
          gcloud run deploy fastapi-api \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=$DATABASE_URL" \
            --set-env-vars "SECRET_KEY=$SECRET_KEY" \
            --set-env-vars "ADMIN_SECRET=$ADMIN_SECRET" \
            --set-env-vars "ENV=production" \
            --set-env-vars "REGISTRATION_ENABLED=false" \
            --set-env-vars "HERMES_SERVICE_TOKEN=$HERMES_SERVICE_TOKEN"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          HERMES_SERVICE_TOKEN: ${{ secrets.HERMES_SERVICE_TOKEN }}

  deploy-mobile:
    name: Deploy Mobile (EAS Update)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish update
        run: eas update --branch production --non-interactive --message "$COMMIT_MSG"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
