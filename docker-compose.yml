services:
  db:
    image: postgres:16-alpine
    container_name: finpa-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-finpa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-finpa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpa}"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpa-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/credentials.json:/app/credentials.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - ENV=${ENV:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-finpa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finpa}
      - SECRET_KEY=${SECRET_KEY}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}
      - ADMIN_SECRET=${ADMIN_SECRET:-}
      - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID:-}
      - GOOGLE_CREDENTIALS_PATH=/app/credentials.json

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: finpa-mobile
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${SERVER_IP}
      - EXPO_PUBLIC_API_URL=http://${SERVER_IP}:8000

volumes:
  pgdata:
